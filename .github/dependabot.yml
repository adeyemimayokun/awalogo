version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      vite-toolchain:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - "@vitejs/plugin-react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
