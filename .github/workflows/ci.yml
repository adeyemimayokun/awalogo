name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/dependency-audit.checks.mjs
      - run: pnpm security:audit
      - run: node --test scripts/neon-runtime-role.checks.mjs
      - run: pnpm validate
      - run: pnpm logos:check-formats
      - run: pnpm catalog:check
      - run: pnpm catalog:generate
      - run: pnpm brands:publish
      - run: pnpm brands:check
      - run: git diff --exit-code -- packages/brands/catalog.json packages/brands/research/source-report.md
      - run: pnpm institutions:check
      - run: pnpm vercel:check-functions
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:plugin
      - run: pnpm build:web
